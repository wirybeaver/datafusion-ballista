name: Iceberg build-gate demo

on:
  push:
    branches: [iceberg/build-gate-demo]
  pull_request:
    paths:
      - 'integrations/iceberg/**'
      - 'ballista/core/src/iceberg/**'
      - '.github/workflows/iceberg-demo.yml'

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake
      - name: Format
        run: cargo fmt --manifest-path integrations/iceberg/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path integrations/iceberg/Cargo.toml --all-targets --locked
      - name: Clippy
        run: cargo clippy --manifest-path integrations/iceberg/Cargo.toml --all-targets --locked -- -D warnings
      - name: Local catalog and Flight SQL tests
        run: cargo test --manifest-path integrations/iceberg/Cargo.toml --locked
      - name: Root lockfile stays unchanged
        run: git diff --exit-code -- Cargo.lock
